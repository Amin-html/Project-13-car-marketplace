services:
  db:
    image: postgres:16
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  django_core:
    build: ./django_core
    env_file: .env
    volumes:
      - ./django_core:/app
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"

  api_service:
    environment:
      - REDIS_URL=redis://redis:6379/0
    build: ./api_service
    env_file: .env
    volumes:
      - ./api_service:/app
      - ./django_core:/django_core
    depends_on:
      db:
        condition: service_healthy
      django_core:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    ports:
      - "8001:8001"

  realtime_service:
    build: ./realtime_service
    env_file: .env
    volumes:
      - ./realtime_service:/app
      - ./django_core:/django_core   # теперь тоже нужен доступ к моделям
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload
    ports:
      - "8002:8002"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  celery_worker:
    build: ./django_core
    env_file: .env
    volumes:
      - ./django_core:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A core worker -l info

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  pg_data:
  minio_data: